description = """
Refinery patrol loop. Poured as a root-only wisp on startup:

  gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}}
  gc bd update $WISP --assignee=$GC_AGENT

Each wisp is ONE iteration: check for work, merge one branch, pour
the next iteration. On crash, re-read the formula steps and determine
where you left off from context (git state, bead state, last action).

Formula steps are NOT materialized as child beads. Read the step
descriptions below and work through them in order.

The loop mechanism: every exit path (happy or early) pours the next
wisp before burning this one. The prompt only bootstraps the first wisp.

Work beads flow directly: pool → polecat → refinery → closed.
No separate MR beads. The polecat sets metadata (branch, target) on
the work bead and assigns it to the refinery. On rejection, the
refinery puts the bead back in the pool with rejection metadata.

⚠⚠ There is ONE merge strategy: DIRECT. Owner ruling, 2026-08-27. The
refinery fast-forward merges the branch to its target and pushes. It never
creates a pull request and never hands one off in place of merging.
`metadata.merge_strategy` is not read, and `mr` / `pr` mode is removed.

A bead may only close when its code is on the target branch, proved by
ANCESTRY (`git merge-base --is-ancestor`), not by content grep. Your merge is
`git merge --ff-only`, so the target fast-forwards to your commit and the SHA
is unchanged: ancestry answers the real question exactly. See the verify
step's own ⚠⚠ note for why `--grep=$WORK` is forbidden here (it matched a
documentation commit on 2026-08-27 and passed a bead whose code had not
landed).

⚠ The "ancestry is always false, use grep" folklore is about SQUASH merges,
which rewrite SHAs. That is how GitHub lands an interactive PR (the `(#NNN)`
commits on main), and it is NOT how you land a bead. Verified 2026-09-08:
`--is-ancestor 8393387f5` (a refinery ff-only merge) is TRUE, while the branch
tip squash-merged as `d8227a4e8 (#311)` is FALSE. Do not import the workaround
for a merge strategy you do not use.

If a bead carries `existing_pr`, a polecat opened a PR it should not have:
merge directly anyway, then close that PR.

Read each step's description before acting — Config values override defaults."""
formula = "mol-refinery-patrol"
version = 9
contract = "graph.v2"

[vars]
[vars.run_tests]
description = "Whether to run tests before merging"
default = "true"

[vars.setup_command]
description = "Setup/install command (e.g., pnpm install). Empty = skip."
default = ""

[vars.typecheck_command]
description = "Type check command (e.g., tsc --noEmit). Empty = skip."
default = ""

[vars.lint_command]
description = "Lint command (e.g., eslint .). Empty = skip."
default = ""

[vars.test_command]
description = "Test command to run (if run_tests is true)"
default = ""

[vars.build_command]
description = "Build command (e.g., go build ./...). Empty = skip."
default = ""

[vars.target_branch]
description = "Default target branch for merges"
default = "main"

[vars.delete_merged_branches]
description = "Whether to delete source branches after merge"
default = "true"

[vars.integration_branch_auto_land]
description = "Auto-create work beads to land completed integration branches"
default = "false"

[vars.event_timeout]
description = "Seconds to wait for events before re-checking (exponential backoff)"
default = "30"

[[steps]]
id = "check-inbox"
title = "Context check, then mail"
description = """
**1. Context check (FIRST — before any work):**
```bash
RSS=$(ps -o rss= -p $$ | tr -d ' ')
RSS_MB=$((RSS / 1024))
```

If RSS > 1500 MB or context feels heavy, request a restart:
```bash
gc runtime request-restart
```
This sets `GC_RESTART_REQUESTED` metadata on the session and blocks
forever. The controller will kill and restart the session on the next
reconcile tick. The current wisp stays assigned and the new session
the new session re-reads formula steps and resumes from context.

**2. Check mail:**
```bash
gc mail inbox
```

Archive any messages you handle. Note any context relevant to
upcoming merge work (e.g., priority overrides, hold requests).

Close this step and proceed."""

[[steps]]
id = "recovery-scan"
title = "Report-only sweep for closed-but-unmerged work (does NOT reopen)"
needs = ["check-inbox"]
description = """
**REPORT ONLY. This step never reopens, reassigns or closes a bead.** It mails
the mayor what it *would* reopen. Owner decision 2026-09-03: prove the predicate
against real data before it is allowed to act on production beads.

**Why this exists.** Your `find-work` poll filters `--status=open`, so a bead
that reached `review_status=pass` and then got closed WITHOUT its branch landing
is invisible to you forever. That is the shape of all nine recorded work-loss
incidents.

**Throttle — this is a sweep, not a per-iteration check:**
```bash
MARK=/tmp/gc-refinery-recovery-scan.stamp
if [ -f "$MARK" ] && [ $(( $(date +%s) - $(stat -c %Y "$MARK") )) -lt 3600 ]; then
  echo "recovery scan: throttled (ran <1h ago)"   # close this step, go to find-work
else
  # ...run the scan below, then:  touch "$MARK"
fi
```

**The query.** ⛔ A bare `gc bd list --status closed` does NOT work: it truncates
at the limit with a non-recency ordering, so recent closures fall off the end.
Measured 2026-09-03 — six known closed beads, only 1-3 returned depending on
filters. `--closed-after` plus `--limit 0` returns them all (56 rows, 6/6 found):
```bash
SINCE=$(date -u -d '3 days ago' +%Y-%m-%d)
gc bd list --assignee=$GC_AGENT --status closed --closed-after "$SINCE" \
  --metadata-field review_status=pass --limit 0 --json > /tmp/recovery-scan.json
```

**The predicate — four tiers, cheapest and strongest first.**
⛔⛔ `git cherry` ALONE IS NOT SUFFICIENT. Validated against 247 real beads on
2026-09-03: it produced **6 false positives**, every one a branch the refinery
had rebased through a conflict, which rewrites the patch-id it keys on. Reopening
those would have re-poured polecats onto finished work. Apply the tiers in order
and stop at the first that answers MERGED:

1. **`metadata.merged_sha` is an ancestor of `origin/$TARGET`** — strongest and
   cheapest. Resolved 2 of the last 3 suspects instantly. Both were merged by a
   commit that does not mention the bead id, so no grep would have found them.
2. **`git cherry origin/$TARGET origin/$BRANCH` has no `+` lines** — merged.
3. **Every `+` commit's SUBJECT appears on `origin/$TARGET`** — merged via
   rebase; the patch-id changed but the change landed.
4. **Branch absent from the remote** — AMBIGUOUS, never MERGED and never LOST.
   Pruned-after-merge and never-pushed look identical. Resolve to UNKNOWN unless
   tier 1 answers it.

Anything surviving all four is a SUSPECT.

```bash
python3 - <<'PYEOF'
import json, subprocess
P = "/gc/projects/execcoreai"
def sh(a): return subprocess.run(a, capture_output=True, text=True, cwd=P).stdout
sh(["git", "fetch", "--prune", "origin"])
rows = json.load(open("/tmp/recovery-scan.json"))
suspect = []
for r in rows:
    m = r.get("metadata") or {}
    if isinstance(m, str):
        try: m = json.loads(m)
        except Exception: m = {}
    bid = r.get("id"); br = m.get("branch"); tgt = m.get("target") or "main"
    if not br:
        continue
    # tier 1: the refinery's own recorded merge sha
    msha = m.get("merged_sha")
    if msha and subprocess.run(["git","merge-base","--is-ancestor",msha,"origin/"+tgt],
                               cwd=P).returncode == 0:
        continue
    ref = "origin/" + br
    if not sh(["git","rev-parse","--verify","--quiet",ref]).strip():
        # tier 4: absent branch is AMBIGUOUS
        if not sh(["git","log","origin/"+tgt,"--grep",bid,"--oneline","-1"]).strip():
            suspect.append((bid, br, tgt, "UNKNOWN: no branch, no merged_sha, target never cites bead"))
        continue
    plus = [l[2:] for l in sh(["git","cherry","origin/"+tgt,ref]).splitlines() if l.startswith("+")]
    if not plus:
        continue                                  # tier 2
    missing = []
    for sha in plus:                              # tier 3
        subj = sh(["git","log","-1","--format=%s",sha]).strip()
        if subj and not sh(["git","log","origin/"+tgt,"--fixed-strings","--grep",subj,
                            "--oneline","-1"]).strip():
            missing.append(subj[:90])
    if missing:
        suspect.append((bid, br, tgt, "%d/%d commits absent by patch-id AND subject: %s"
                        % (len(missing), len(plus), missing[:3])))
print("recovery scan: examined %d, suspect %d" % (len(rows), len(suspect)))
for s in suspect:
    print("  SUSPECT %s | %s -> %s | %s" % s)
open("/tmp/recovery-scan-suspects.txt","w").write(
    "\n".join("%s | %s -> %s | %s" % s for s in suspect))
PYEOF
```

**Report. Do not act.**
```bash
if [ -s /tmp/recovery-scan-suspects.txt ]; then
  gc mail send mayor/ -s "Recovery scan: $(wc -l < /tmp/recovery-scan-suspects.txt) closed-but-unmerged suspect(s)" \
    -m "$(cat /tmp/recovery-scan-suspects.txt)

REPORT ONLY -- nothing was reopened. Each line survived all four merge tiers
(recorded merged_sha, git cherry patch-id, subject match, absent-branch).
Verify by hand before reopening: an unmerged branch may be SUPERSEDED rather
than stranded, and a bead whose work was redone elsewhere must NOT be reopened."
fi
touch /tmp/gc-refinery-recovery-scan.stamp
```

⚠ A clean scan is a real result — say so in the patrol summary. A scan that
errors is NOT a clean scan; report the error instead of the absence of suspects.

Close this step and proceed to find-work."""

[[steps]]
id = "find-work"
title = "Find next work bead assigned to me or wait"
needs = ["recovery-scan"]
description = """
**Config: event_timeout = {{event_timeout}}**

Search for work beads assigned to you with branch metadata:
```bash
WORK=$(gc bd list --assignee=$GC_AGENT --status=open \
  --exclude-type=epic --limit=1 --json | jq -r '.[0].id // empty')
```

If found: read the bead metadata to confirm it has a branch:
```bash
gc bd show $WORK --json | jq '.[0].metadata'
```
The bead MUST have `metadata.branch`. If `metadata.target` is missing,
use {{target_branch}} as default. Note the work bead ID and close this step.

If NO work found: enter a **poll-then-watch loop**. The watch is a
wake-up signal — never a data source. The `gc bd list` re-poll is the
only authoritative answer to "is there work?".

```bash
TIMEOUT={{event_timeout}}
while [ -z "$WORK" ]; do
  SEQ=$(gc events --seq)
  # Filter to events that touch refinery work; drops infra noise
  # (gate-sweep, orphan-sweep, etc.) so the wake rate matches our cadence.
  gc events --watch --type=bead.updated --after=$SEQ \
    --payload-match "bead.assignee=$GC_AGENT" \
    --timeout ${TIMEOUT}s >/dev/null 2>&1 || true
  # Event arrived OR timeout — always re-poll, never trust event content.
  WORK=$(gc bd list --assignee=$GC_AGENT --status=open \
    --exclude-type=epic --exclude-type=molecule --limit=1 --json | jq -r '.[0].id // empty')
  # Exponential backoff on timeout: helps quiet rigs avoid hot-looping.
  if [ -z "$WORK" ]; then
    TIMEOUT=$(( TIMEOUT * 2 ))
    [ $TIMEOUT -gt 300 ] && TIMEOUT=300
  fi
done
```

Why the re-poll matters: a previous bug pattern (observed 2026-05-10) had
the refinery interpreting event *content* and dismissing the wake-up when
the payload didn't superficially match its work. A bead reassignment event
slipped through and `au-quwk2` sat unprocessed for 46+ minutes. Always
re-poll on every wake; the gc bd list cannot be missed by a cursor race.

Why the payload filter: the watch was waking the refinery on every
`order:gate-sweep` / `order:orphan-sweep` infra bead, which floods the
event stream and burns context. Filtering to events touching the
refinery's own assignee drops ~95% of wake-ups without affecting
correctness — the re-poll on the surviving wakes still catches everything
the filter accidentally drops.

If `--payload-match bead.assignee=$GC_AGENT` returns zero matches against
real events (the payload schema differs from expectation), fall back to
unfiltered `--type=bead.updated`. The re-poll keeps correctness; the
filter is purely optimization.

**Do not close this step until you have a work bead with branch metadata.**"""

[[steps]]
id = "rebase"
title = "Rebase branch on target"
needs = ["find-work"]
description = """
**Config: target_branch = {{target_branch}}**

Read the work bead metadata:
```bash
BRANCH=$(gc bd show $WORK --json | jq -r '.[0].metadata.branch')
TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.target // "{{target_branch}}"')
```

Fetch and attempt mechanical rebase:
```bash
git fetch --prune origin
git checkout -b temp origin/$BRANCH
git rebase origin/$TARGET
```

If rebase SUCCEEDED (exit 0): close this step, proceed to run-tests.

If rebase FAILED (conflicts):

1. Abort: `git rebase --abort`
2. Clean up the existing workflow and reopen the source bead:
```bash
gc workflow delete-source $WORK --apply && gc workflow reopen-source $WORK
```
3. Put the work bead back in the pool with rejection metadata:
```bash
# Honor the pool the work originally came from (set by mol-polecat-work
# stamp-worker-pool on first claim). Falls back to polecat-sonnet (the
# default-tier variant) for beads that lack the stamp — e.g. manual
# slings or replayed wisps that bypassed mol-polecat-work.
POLECAT_TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.worker_pool // empty')
if [ -z "$POLECAT_TARGET" ]; then
    POLECAT_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}polecat-sonnet"
fi
gc bd update $WORK \
  --status=open \
  --assignee="" \
  --set-metadata rejection_reason="Conflicts with $TARGET at $(git rev-parse origin/$TARGET)" \
  --set-metadata gc.routed_to="$POLECAT_TARGET"
```
4. Do NOT delete the branch (new polecat needs it for conflict resolution).
5. Clean up temp branch: `git checkout {{target_branch}} && git branch -D temp`
6. Pour next patrol iteration before burning:
```bash
NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id')
gc bd update "$NEXT" --assignee=$GC_AGENT
```
7. Burn this wisp: `gc bd mol burn <wisp-id> --force`

**A new polecat will pick up the bead, see the branch and rejection,
rebase, and reassign to refinery.**"""

[[steps]]
id = "run-tests"
title = "Run quality checks and tests"
needs = ["rebase"]
description = """
**Config: run_tests = {{run_tests}}**
**Config: test_command = {{test_command}}**
**Config: setup_command = {{setup_command}}**
**Config: typecheck_command = {{typecheck_command}}**
**Config: lint_command = {{lint_command}}**
**Config: build_command = {{build_command}}**

Run each configured check in order (skip empty ones silently):
```bash
{{setup_command}}
{{typecheck_command}}
{{lint_command}}
{{build_command}}
```

If run_tests = "true":
```bash
{{test_command}}
```

If run_tests = "false": skip tests entirely.

Track results: which checks ran, pass/fail, specific failures.
Close this step when all checks complete (pass or fail)."""

[[steps]]
id = "handle-failures"
title = "Handle quality check or test failures"
needs = ["run-tests"]
description = """
If all checks and tests PASSED: close this step, proceed to merge-push.

If any check or test FAILED:

Read the current branch and target again:
```bash
BRANCH=$(gc bd show $WORK --json | jq -r '.[0].metadata.branch')
TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.target // "{{target_branch}}"')
```

1. Diagnose: branch regression or pre-existing on target?

2. If branch caused it:
   - Clean up the existing workflow and reopen the source bead:
     ```bash
     gc workflow delete-source $WORK --apply && gc workflow reopen-source $WORK
     ```
   - Put the work bead back in the pool with rejection metadata:
     ```bash
     # Honor the pool the work originally came from (set by
     # mol-polecat-work stamp-worker-pool on first claim). Falls back
     # to polecat-sonnet (the default-tier variant) for beads that
     # lack the stamp — e.g. manual slings or replayed wisps that
     # bypassed mol-polecat-work.
     POLECAT_TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.worker_pool // empty')
     if [ -z "$POLECAT_TARGET" ]; then
         POLECAT_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}polecat-sonnet"
     fi
     gc bd update $WORK \
       --status=open \
       --assignee="" \
       --set-metadata rejection_reason="<failure summary>" \
       --set-metadata gc.routed_to="$POLECAT_TARGET"
     ```
   - Delete branch: `git push origin --delete $BRANCH`
   - Clean up: `git checkout "$TARGET" && git branch -D temp`
   - Pour next patrol iteration before burning:
     ```bash
     NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id')
     gc bd update "$NEXT" --assignee=$GC_AGENT
     ```
   - Burn this wisp: `gc bd mol burn <wisp-id> --force`

3. If pre-existing on target:

   **⛔ SEARCH FIRST, AND TRUST A ZERO ONLY IF THE SEARCH ACTUALLY RAN.**
   Until 2026-09-25 this step said `gc bd list ... --search`, which is not a
   flag on `bd list`. It exited 1 with `unknown flag: --search` on every
   invocation, printed no bug IDs, and so read as "no duplicate found" every
   single time. The result: 9 of 16 open test-flake beads on ExecCoreAI were
   filed by this step, and at least one pair (ex-f6yc28 and ex-quap0p) is the
   same defect filed twice, one day apart. `bd search` is the correct command.

   - Search by the TEST NAME or the distinctive error text, not by your prose
     summary. A summary you just wrote will not match a summary someone else
     wrote for the same failure; a test name matches exactly.
     ```bash
     # Pick the narrowest literal you have: the failing Test function name, the
     # constraint name, or the verbatim error string. NOT your own wording.
     NEEDLE="<TestFunctionName or verbatim error text>"
     gc bd search "$NEEDLE" --limit 20 ; RC=$?
     ```
   - ⛔ **Do NOT pass `--status=open`.** `bd search` includes closed issues on
     purpose, so that "was this already filed or already fixed?" cannot
     silently answer no. A duplicate that was filed and closed last week is
     still a duplicate, and refiling it is how a fixed bug comes back as new
     work.
   - ⛔ **If `RC` is not 0, the search DID NOT RUN. That is not an absence.**
     Do not file. Fix the invocation or report the failure in your step notes
     and mail the mayor. Treating a broken probe as "nothing found" is the
     exact bug this block replaced.
   - If a match exists (any status): note its ID, add a one-line comment to it
     recording that this merge hit it again, and proceed with merge. Do not
     file a second bead.
     ```bash
     gc bd comment <existing-id> "Hit again by refinery on $BRANCH -> $TARGET at $(date -u +%Y-%m-%dT%H:%M:%SZ)."
     ```
   - If the match is CLOSED and the failure is real again, say so on that bead
     and reopen it rather than filing a new one: `gc bd reopen <existing-id>`.
   - Only if the search ran (RC=0) and returned nothing, file a new bead. Put
     the TEST NAME in the title so the next search finds it:
     ```bash
     gc bd create --type=bug --priority=1 --title="Pre-existing failure: <TestFunctionName> - <short symptom>"
     ```
   - ⚠ If a later commit RENAMES the test, this bead's title now names a
     function that greps to zero and reads as "already fixed". That happened to
     ex-680wml for 21 days. If you notice a rename while searching, retitle the
     existing bead instead of filing a new one.
   - Proceed with merge (failure not caused by this branch)

**GATE**: Cannot merge without all checks passing OR pre-existing bug filed/found.
**FORBIDDEN**: Writing code to fix failures. You are a merge processor."""

[[steps]]
id = "merge-push"
title = "Merge and push"
needs = ["handle-failures"]
description = """
**Config: target_branch = {{target_branch}}**
**Config: delete_merged_branches = {{delete_merged_branches}}**

⚠⚠ **THERE IS ONE STRATEGY: DIRECT. Owner ruling, 2026-08-27.** You merge the
branch to its target and push. You NEVER create a pull request, and you NEVER
hand one off in place of merging. `mr` / `pr` mode is removed from this formula.

Read the merge target from the work bead metadata:
```bash
BRANCH=$(gc bd show $WORK --json | jq -r '.[0].metadata.branch')
TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.target // "{{target_branch}}"')
EXISTING_PR=$(gc bd show $WORK --json | jq -r '.[0].metadata.existing_pr // empty')
```

⚠ `metadata.merge_strategy` is **not read**. If a bead carries `merge_strategy=mr`
or `pr`, that is stale metadata from before this ruling, not an instruction.

⚠ `metadata.existing_pr` is **not a mode switch**. It means a polecat opened a PR
it should not have. You still merge directly; you close that PR afterwards, in
step 5.

**0. ⛔ MIGRATION ORDINAL GATE — refuse a duplicate version, do not merge it.**

Two branches in flight independently pick "next free" from their own branch
points, so they pick the SAME number. Goose parses the version from the
FILENAME, so two files at one version is a duplicate-version failure in every
environment — and git never conflicts, because the paths differ. This has now
happened three times (RFC019 twice, then ex-04xrft vs ex-cr8gc5 on 2026-09-03,
across two UNRELATED beads at different tiers).

```bash
git fetch --prune origin
# versions this branch INTRODUCES that are not on the target.
# ⛔ Match '^[0-9]+', NOT '^[0-9]{5}'. Migrations are TIMESTAMPED since #869
# (YYYYMMDDHHMMSS); the 5-digit form truncated 20260928180157 to '20260', so
# EVERY timestamped migration collapsed to one bucket, nothing ever matched
# "^20260_", and this duplicate gate silently passed everything for the whole
# timestamp era. Verified dead on 2026-09-28. The legacy 00001-00420 files
# still match '^[0-9]+' unchanged.
NEW=$(git diff --name-only origin/$TARGET...origin/$BRANCH -- backend/migrations/sql \
      | xargs -r -n1 basename | grep -oE '^[0-9]+' | sort -u)
DUP=""
for o in $NEW; do
  # a file at this ordinal already on the target, with a DIFFERENT name
  ON_TARGET=$(git ls-tree --name-only origin/$TARGET backend/migrations/sql/ \
              | xargs -r -n1 basename | grep -E "^${o}_" || true)
  MINE=$(git ls-tree --name-only origin/$BRANCH backend/migrations/sql/ \
         | xargs -r -n1 basename | grep -E "^${o}_" || true)
  if [ -n "$ON_TARGET" ] && [ "$ON_TARGET" != "$MINE" ]; then
    DUP="$DUP $o($MINE vs $ON_TARGET)"
  fi
done
```

**Second: there is deliberately NO out-of-order check. A version BELOW the
target's maximum is NORMAL in this repository — do not add one back.**

`backend/migrations/sql/README.md` carries a section headed "Out-of-order
arrival is normal now": versions no longer arrive in order and are not supposed
to, `backend/cmd/migrate` passes `goose.WithAllowMissing` (and
`backend/migrations/apply.go` the provider spelling, `WithAllowOutofOrder`), and
gaps plus out-of-order versions are expected and mean nothing is wrong — in its
own words, **do not "fix" them.** Two further lines on main agree:
  `backend/cmd/migrate/main.go:95` passes `goose.WithAllowMissing()` in production.
  `backend/internal/deploycheck/migration_version_guard_test.go:51` states that
  this guard "no longer polices an ordinal CEILING".

⛔⛔ THIS STEP ONCE HELD A CEILING CHECK, AND IT REJECTED A GOOD BEAD TWICE.
On 2026-09-28 it rejected ex-1kfbld (migration 20260928180157, below main's max
20260928193254) saying "goose will REJECT this in production" and demanding a
renumber plus an update to every reference — after the bead had PASSED REVIEW
TWICE, with both reviewers clearing that exact migration deliberately. The
premise was false; the demanded renumber was broad churn on a migration-bearing
branch for a defect that did not exist; and the check cited as its authority the
very README that forbids it. Note also that the shell it ran could not produce
the numbers it reported: with the old 5-digit extraction, MAXT and every new
version both collapsed to '20260', so the comparison was always equal and the
check was dead as written. It fired only because the agent re-derived the rule
from this prose at full 14-digit precision. Do not restore it, and do not
re-derive it: if you believe you have found a ceiling violation, you have found
this note instead.

⭐ WHY A REAL P1 ONCE DEMANDED THIS CHECK, AND WHY IT NO LONGER APPLIES. Do not
restore the check on the strength of that bead. ex-zzr83l (2026-09-09, P1,
closed) measured this hazard twice and built a below-ceiling guard in
deploycheck. It was RIGHT AT THE TIME, and its own words say why: it cites
`cmd/migrate/main.go:71` running plain `goose.UpContext` with NO AllowMissing, so
goose then applied migrations strictly above the current version and a low one
really did merge green and never run. THE REPOSITORY CHANGED UNDER IT. Migrations
became timestamped (#869, 2026-09-22), `cmd/migrate` adopted
`goose.WithAllowMissing`, and the deploycheck guard was deliberately de-scoped —
`migration_version_guard_test.go:51` now says in terms that it no longer polices
an ordinal CEILING. So ex-zzr83l is SUPERSEDED, not contradicted, and this
formula simply kept the retired doctrine alive after the repository retired it.
Check the three evidence lines above against origin/main before believing any
argument to bring it back.

⚠ One hazard from that bead does survive, and it is NOT a ceiling rule: filling
one of the permanently ABANDONED ordinals the README lists (00072, 00073, 00085,
00130, and the rest). Those were each used once on some database and then
orphaned, so a new file under one of them can be skipped silently in production
while applying normally in CI — the README calls that the one case where exactly
that happens. It is gated in the repository, not here: the timestamp rule in
`migration_version_guard_test.go` fails any pull request that numbers a migration
any way other than by the clock, which makes a hand-picked abandoned ordinal
impossible to add in the first place.

⚠ The one real hazard is REUSE, and the check above is what catches it: once a
version is recorded in `goose_db_version`, goose skips the file behind it
forever — no error, no log line — and CI cannot see it because CI migrates a
scratch database from zero. That is a name-vs-name comparison at a SHARED
version, never "this version is low".

If `$DUP` is non-empty: **STOP. Do not merge.** Reject the bead back to its pool
so the polecat renumbers, exactly as a failed check does in handle-failures:

```bash
POLECAT_TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.worker_pool // empty')
[ -z "$POLECAT_TARGET" ] && POLECAT_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}polecat-sonnet"
gc workflow delete-source $WORK --apply && gc workflow reopen-source $WORK
gc bd update $WORK --status=open --assignee="" \
  --set-metadata rejection_reason="Migration ordinal collision:$DUP. Renumber to the next free ordinal on $TARGET and update every reference to it (test names, embedded lists, identifiers)." \
  --set-metadata gc.routed_to="$POLECAT_TARGET"
```
Then pour the next patrol iteration and burn this wisp, as in handle-failures.

⚠ Two cases that must NOT trip this gate: an ordinal whose file is already on the
target under the SAME name (inherited, not new), and an ordinal the branch does
not introduce at all. The comparison is name-vs-name at a shared ordinal, never
"this ordinal exists".

**1. Merge and push target branch:**
```bash
git checkout $TARGET
git merge --ff-only temp
git push origin $TARGET
```

**2. Verify push:**
```bash
git fetch origin
LOCAL=$(git rev-parse $TARGET)
REMOTE=$(git rev-parse origin/$TARGET)
[ "$LOCAL" = "$REMOTE" ] || echo "PUSH FAILED - do not proceed"
```
If SHAs differ: STOP. Debug and retry. Do NOT continue.

**3. ⚠⚠ PROVE THE BEAD'S COMMITS ARE ON THE TARGET:**
```bash
git fetch origin
# You merged with --ff-only, which PRESERVES SHAs, so ancestry is exact here.
if ! git merge-base --is-ancestor temp origin/$TARGET; then
  echo "STOP. temp is not an ancestor of origin/$TARGET. Do not close the bead."
  gc runtime drain-ack
  exit 1
fi
echo "landed: $(git log origin/$TARGET --oneline -1)"
```

⚠⚠ **Use ancestry here, NOT `git log --grep=$WORK`.** Both halves matter:

- **Ancestry is exact for YOUR path.** Step 1 is `git merge --ff-only temp`, so
  the target literally fast-forwards to `temp`'s commit. The SHA is unchanged and
  `--is-ancestor` answers the real question.
- **`--grep=$WORK` has false positives**, which is how it failed on 2026-08-27:
  `git log origin/main --grep=ex-b2k69h` matched a *documentation* commit whose
  message merely described the incident, minutes before the actual fix landed.
  Any commit that MENTIONS a bead id satisfies a grep -- a revert, a rejection
  note, an RFC. That is not proof the code is there.

⚠ The "ancestry is always false, use grep" folklore is about **squash merges**,
which rewrite SHAs. That is how GitHub lands a PR, and it is NOT how you land a
bead. Do not import the workaround for a merge strategy you do not use. If you
ever find yourself verifying someone else's squash merge, grep is the weaker
tool you fall back to, and you read the matched commit before believing it.

⚠⚠ **A bead may ONLY close when its code is on the target branch.** On
2026-08-27 this step closed `ex-b2k69h` on a PR handoff with the code still off
`main`. That released the bead's dependent `ex-gkscl2`, which reads ready the
instant its blocker closes, onto a `main` missing the guard it builds on.
Neither outcome is a conflict and both compile, which is why this gate is here.

**4. Record merge metadata and close work bead:**
```bash
gc bd update $WORK \
  --set-metadata merge_result=merged \
  --set-metadata merged_sha=$(git rev-parse HEAD) \
  --set-metadata merged_target=$TARGET
gc bd close $WORK --reason "Merged to $TARGET at $(git rev-parse --short HEAD)"
```

**5. Close a pull request the polecat should not have opened:**
```bash
if [ -n "$EXISTING_PR" ]; then
  MERGED_SHORT=$(git rev-parse --short origin/$TARGET)
  gh pr close "$EXISTING_PR" --comment "Merged directly to $TARGET as $MERGED_SHORT by the refinery. This repository's fleet path is polecat -> reviewer -> refinery -> $TARGET; a bead branch does not land through a pull request. See forged-conventions rule 12."
  PR_STATE_AFTER=$(gh pr view "$EXISTING_PR" --json state -q '.state')
  if [ "$PR_STATE_AFTER" != "CLOSED" ] && [ "$PR_STATE_AFTER" != "MERGED" ]; then
    gc mail send mayor/ -s "Could not close stray PR for $WORK" -m "PR: $EXISTING_PR
State after close attempt: $PR_STATE_AFTER
The merge itself SUCCEEDED; only the PR cleanup failed. Bead $WORK is closed and
its code is on $TARGET. Close the PR by hand."
  fi
fi
```
⚠ Do this **after** the push, never before: if the merge fails you still want the
PR. ⚠ A squash or rebase merge does **not** auto-close a PR, because the SHA on
the target differs from the branch's. GitHub leaves it open forever unless you
close it explicitly, which is why the state is re-read.

⚠ Failing to close the PR is **not** a merge failure. Mail the mayor and carry on;
do not reopen, revert, or block the bead over it.

**6. Cleanup:**
```bash
git branch -d temp
```
If delete_merged_branches = "true": `git push origin --delete $BRANCH`

**GATE**: bead closure requires BOTH a verified target push AND
`git merge-base --is-ancestor temp origin/$TARGET`. A pull request never
satisfies this gate, and neither does a grep match."""

[[steps]]
id = "patrol-summary"
title = "Record patrol cycle summary"
needs = ["merge-push"]
description = """
Summarize this patrol cycle for handoff context. This becomes the
audit trail — the next refinery session can see what happened.

Include:
- Branch merged (name, target)
- Test results (pass/fail, which checks ran)
- Bugs filed (IDs, if any pre-existing failures were tracked)
- Rejections (if the branch was rejected back to pool)
- Any escalations sent

If the cycle ended early (conflict rejection, no work found), note
why and what state was left.

This summary is not stored separately — it lives in the wisp's
closing reason. The next session can find it via `gc bd list --type=wisp
--status=closed --limit=5` if it needs predecessor context."""

[[steps]]
id = "next-iteration"
title = "Prepare next patrol iteration"
needs = ["patrol-summary"]
description = """
**Config: integration_branch_auto_land = {{integration_branch_auto_land}}**

**1. Integration branch check (only if auto_land = "true"):**

If the merge target was an integration branch, check if the parent
owned convoy is now fully closed:
```bash
gc bd list --type=convoy --status=open
```
For each owned convoy with an integration branch: if ALL children are
closed, assign the convoy bead itself to you with the metadata needed
for a merge:
```bash
gc bd update <convoy-id> --assignee=$GC_AGENT \
  --set-metadata branch=<integration-branch> \
  --set-metadata target={{target_branch}}
```
The next patrol iteration picks up the convoy like any other work bead
and merges the integration branch to {{target_branch}} normally.

**FORBIDDEN**: Landing integration branches via raw `git merge`/`git push`.
The convoy bead assignment is the ONLY path.

If auto_land = "false": skip this entirely.

**2. Pour next iteration:**
```bash
NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id')
gc bd update "$NEXT" --assignee=$GC_AGENT
```

**4. Burn this wisp:**
```bash
gc bd mol burn <this-wisp-id> --force
```

Close this step. The new wisp is ready — re-read formula steps to begin."""
