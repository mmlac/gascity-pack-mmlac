description = """
Refinery patrol loop. Poured as a root-only wisp on startup:

  gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}}
  gc bd update $WISP --assignee=$GC_AGENT

Each wisp is ONE iteration: check for work, merge one branch, pour
the next iteration. On crash, re-read the formula steps and determine
where you left off from context (git state, bead state, last action).

Formula steps are NOT materialized as child beads. Read the step
descriptions below and work through them in order.

The loop mechanism: every exit path (happy or early) pours the next
wisp before burning this one. The prompt only bootstraps the first wisp.

Work beads flow directly: pool → polecat → refinery → closed.
No separate MR beads. The polecat sets metadata (branch, target) on
the work bead and assigns it to the refinery. On rejection, the
refinery puts the bead back in the pool with rejection metadata.

⚠⚠ There is ONE merge strategy: DIRECT. Owner ruling, 2026-08-27. The
refinery fast-forward merges the branch to its target and pushes. It never
creates a pull request and never hands one off in place of merging.
`metadata.merge_strategy` is not read, and `mr` / `pr` mode is removed.

A bead may only close when its code is on the target branch, proved by
content (`git log origin/$TARGET --grep=$WORK`) rather than by ancestry,
because this repository squash-merges. If a bead carries `existing_pr`, a
polecat opened a PR it should not have: merge directly anyway, then close
that PR.

Read each step's description before acting — Config values override defaults."""
formula = "mol-refinery-patrol"
version = 6
contract = "graph.v2"

[vars]
[vars.run_tests]
description = "Whether to run tests before merging"
default = "true"

[vars.setup_command]
description = "Setup/install command (e.g., pnpm install). Empty = skip."
default = ""

[vars.typecheck_command]
description = "Type check command (e.g., tsc --noEmit). Empty = skip."
default = ""

[vars.lint_command]
description = "Lint command (e.g., eslint .). Empty = skip."
default = ""

[vars.test_command]
description = "Test command to run (if run_tests is true)"
default = ""

[vars.build_command]
description = "Build command (e.g., go build ./...). Empty = skip."
default = ""

[vars.target_branch]
description = "Default target branch for merges"
default = "main"

[vars.delete_merged_branches]
description = "Whether to delete source branches after merge"
default = "true"

[vars.integration_branch_auto_land]
description = "Auto-create work beads to land completed integration branches"
default = "false"

[vars.event_timeout]
description = "Seconds to wait for events before re-checking (exponential backoff)"
default = "30"

[[steps]]
id = "check-inbox"
title = "Context check, then mail"
description = """
**1. Context check (FIRST — before any work):**
```bash
RSS=$(ps -o rss= -p $$ | tr -d ' ')
RSS_MB=$((RSS / 1024))
```

If RSS > 1500 MB or context feels heavy, request a restart:
```bash
gc runtime request-restart
```
This sets `GC_RESTART_REQUESTED` metadata on the session and blocks
forever. The controller will kill and restart the session on the next
reconcile tick. The current wisp stays assigned and the new session
the new session re-reads formula steps and resumes from context.

**2. Check mail:**
```bash
gc mail inbox
```

Archive any messages you handle. Note any context relevant to
upcoming merge work (e.g., priority overrides, hold requests).

Close this step and proceed."""

[[steps]]
id = "find-work"
title = "Find next work bead assigned to me or wait"
needs = ["check-inbox"]
description = """
**Config: event_timeout = {{event_timeout}}**

Search for work beads assigned to you with branch metadata:
```bash
WORK=$(gc bd list --assignee=$GC_AGENT --status=open \
  --exclude-type=epic --limit=1 --json | jq -r '.[0].id // empty')
```

If found: read the bead metadata to confirm it has a branch:
```bash
gc bd show $WORK --json | jq '.[0].metadata'
```
The bead MUST have `metadata.branch`. If `metadata.target` is missing,
use {{target_branch}} as default. Note the work bead ID and close this step.

If NO work found: enter a **poll-then-watch loop**. The watch is a
wake-up signal — never a data source. The `gc bd list` re-poll is the
only authoritative answer to "is there work?".

```bash
TIMEOUT={{event_timeout}}
while [ -z "$WORK" ]; do
  SEQ=$(gc events --seq)
  # Filter to events that touch refinery work; drops infra noise
  # (gate-sweep, orphan-sweep, etc.) so the wake rate matches our cadence.
  gc events --watch --type=bead.updated --after=$SEQ \
    --payload-match "bead.assignee=$GC_AGENT" \
    --timeout ${TIMEOUT}s >/dev/null 2>&1 || true
  # Event arrived OR timeout — always re-poll, never trust event content.
  WORK=$(gc bd list --assignee=$GC_AGENT --status=open \
    --exclude-type=epic --exclude-type=molecule --limit=1 --json | jq -r '.[0].id // empty')
  # Exponential backoff on timeout: helps quiet rigs avoid hot-looping.
  if [ -z "$WORK" ]; then
    TIMEOUT=$(( TIMEOUT * 2 ))
    [ $TIMEOUT -gt 300 ] && TIMEOUT=300
  fi
done
```

Why the re-poll matters: a previous bug pattern (observed 2026-05-10) had
the refinery interpreting event *content* and dismissing the wake-up when
the payload didn't superficially match its work. A bead reassignment event
slipped through and `au-quwk2` sat unprocessed for 46+ minutes. Always
re-poll on every wake; the gc bd list cannot be missed by a cursor race.

Why the payload filter: the watch was waking the refinery on every
`order:gate-sweep` / `order:orphan-sweep` infra bead, which floods the
event stream and burns context. Filtering to events touching the
refinery's own assignee drops ~95% of wake-ups without affecting
correctness — the re-poll on the surviving wakes still catches everything
the filter accidentally drops.

If `--payload-match bead.assignee=$GC_AGENT` returns zero matches against
real events (the payload schema differs from expectation), fall back to
unfiltered `--type=bead.updated`. The re-poll keeps correctness; the
filter is purely optimization.

**Do not close this step until you have a work bead with branch metadata.**"""

[[steps]]
id = "rebase"
title = "Rebase branch on target"
needs = ["find-work"]
description = """
**Config: target_branch = {{target_branch}}**

Read the work bead metadata:
```bash
BRANCH=$(gc bd show $WORK --json | jq -r '.[0].metadata.branch')
TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.target // "{{target_branch}}"')
```

Fetch and attempt mechanical rebase:
```bash
git fetch --prune origin
git checkout -b temp origin/$BRANCH
git rebase origin/$TARGET
```

If rebase SUCCEEDED (exit 0): close this step, proceed to run-tests.

If rebase FAILED (conflicts):

1. Abort: `git rebase --abort`
2. Clean up the existing workflow and reopen the source bead:
```bash
gc workflow delete-source $WORK --apply && gc workflow reopen-source $WORK
```
3. Put the work bead back in the pool with rejection metadata:
```bash
# Honor the pool the work originally came from (set by mol-polecat-work
# stamp-worker-pool on first claim). Falls back to polecat-sonnet (the
# default-tier variant) for beads that lack the stamp — e.g. manual
# slings or replayed wisps that bypassed mol-polecat-work.
POLECAT_TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.worker_pool // empty')
if [ -z "$POLECAT_TARGET" ]; then
    POLECAT_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}polecat-sonnet"
fi
gc bd update $WORK \
  --status=open \
  --assignee="" \
  --set-metadata rejection_reason="Conflicts with $TARGET at $(git rev-parse origin/$TARGET)" \
  --set-metadata gc.routed_to="$POLECAT_TARGET"
```
4. Do NOT delete the branch (new polecat needs it for conflict resolution).
5. Clean up temp branch: `git checkout {{target_branch}} && git branch -D temp`
6. Pour next patrol iteration before burning:
```bash
NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id')
gc bd update "$NEXT" --assignee=$GC_AGENT
```
7. Burn this wisp: `gc bd mol burn <wisp-id> --force`

**A new polecat will pick up the bead, see the branch and rejection,
rebase, and reassign to refinery.**"""

[[steps]]
id = "run-tests"
title = "Run quality checks and tests"
needs = ["rebase"]
description = """
**Config: run_tests = {{run_tests}}**
**Config: test_command = {{test_command}}**
**Config: setup_command = {{setup_command}}**
**Config: typecheck_command = {{typecheck_command}}**
**Config: lint_command = {{lint_command}}**
**Config: build_command = {{build_command}}**

Run each configured check in order (skip empty ones silently):
```bash
{{setup_command}}
{{typecheck_command}}
{{lint_command}}
{{build_command}}
```

If run_tests = "true":
```bash
{{test_command}}
```

If run_tests = "false": skip tests entirely.

Track results: which checks ran, pass/fail, specific failures.
Close this step when all checks complete (pass or fail)."""

[[steps]]
id = "handle-failures"
title = "Handle quality check or test failures"
needs = ["run-tests"]
description = """
If all checks and tests PASSED: close this step, proceed to merge-push.

If any check or test FAILED:

Read the current branch and target again:
```bash
BRANCH=$(gc bd show $WORK --json | jq -r '.[0].metadata.branch')
TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.target // "{{target_branch}}"')
```

1. Diagnose: branch regression or pre-existing on target?

2. If branch caused it:
   - Clean up the existing workflow and reopen the source bead:
     ```bash
     gc workflow delete-source $WORK --apply && gc workflow reopen-source $WORK
     ```
   - Put the work bead back in the pool with rejection metadata:
     ```bash
     # Honor the pool the work originally came from (set by
     # mol-polecat-work stamp-worker-pool on first claim). Falls back
     # to polecat-sonnet (the default-tier variant) for beads that
     # lack the stamp — e.g. manual slings or replayed wisps that
     # bypassed mol-polecat-work.
     POLECAT_TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.worker_pool // empty')
     if [ -z "$POLECAT_TARGET" ]; then
         POLECAT_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}polecat-sonnet"
     fi
     gc bd update $WORK \
       --status=open \
       --assignee="" \
       --set-metadata rejection_reason="<failure summary>" \
       --set-metadata gc.routed_to="$POLECAT_TARGET"
     ```
   - Delete branch: `git push origin --delete $BRANCH`
   - Clean up: `git checkout "$TARGET" && git branch -D temp`
   - Pour next patrol iteration before burning:
     ```bash
     NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id')
     gc bd update "$NEXT" --assignee=$GC_AGENT
     ```
   - Burn this wisp: `gc bd mol burn <wisp-id> --force`

3. If pre-existing on target:
   - Check for duplicates first:
     ```bash
     gc bd list --type=bug --status=open --search "<failure summary>"
     ```
   - If a matching bug already exists: note its ID and proceed with merge.
   - If no duplicate: file a new bead:
     ```bash
     gc bd create --type=bug --priority=1 --title="Pre-existing failure: <summary>"
     ```
   - Proceed with merge (failure not caused by this branch)

**GATE**: Cannot merge without all checks passing OR pre-existing bug filed/found.
**FORBIDDEN**: Writing code to fix failures. You are a merge processor."""

[[steps]]
id = "merge-push"
title = "Merge and push"
needs = ["handle-failures"]
description = """
**Config: target_branch = {{target_branch}}**
**Config: delete_merged_branches = {{delete_merged_branches}}**

⚠⚠ **THERE IS ONE STRATEGY: DIRECT. Owner ruling, 2026-08-27.** You merge the
branch to its target and push. You NEVER create a pull request, and you NEVER
hand one off in place of merging. `mr` / `pr` mode is removed from this formula.

Read the merge target from the work bead metadata:
```bash
BRANCH=$(gc bd show $WORK --json | jq -r '.[0].metadata.branch')
TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.target // "{{target_branch}}"')
EXISTING_PR=$(gc bd show $WORK --json | jq -r '.[0].metadata.existing_pr // empty')
```

⚠ `metadata.merge_strategy` is **not read**. If a bead carries `merge_strategy=mr`
or `pr`, that is stale metadata from before this ruling, not an instruction.

⚠ `metadata.existing_pr` is **not a mode switch**. It means a polecat opened a PR
it should not have. You still merge directly; you close that PR afterwards, in
step 5.

**1. Merge and push target branch:**
```bash
git checkout $TARGET
git merge --ff-only temp
git push origin $TARGET
```

**2. Verify push:**
```bash
git fetch origin
LOCAL=$(git rev-parse $TARGET)
REMOTE=$(git rev-parse origin/$TARGET)
[ "$LOCAL" = "$REMOTE" ] || echo "PUSH FAILED - do not proceed"
```
If SHAs differ: STOP. Debug and retry. Do NOT continue.

**3. ⚠⚠ PROVE THE BEAD'S COMMITS ARE ON THE TARGET:**
```bash
git fetch origin
# You merged with --ff-only, which PRESERVES SHAs, so ancestry is exact here.
if ! git merge-base --is-ancestor temp origin/$TARGET; then
  echo "STOP. temp is not an ancestor of origin/$TARGET. Do not close the bead."
  gc runtime drain-ack
  exit 1
fi
echo "landed: $(git log origin/$TARGET --oneline -1)"
```

⚠⚠ **Use ancestry here, NOT `git log --grep=$WORK`.** Both halves matter:

- **Ancestry is exact for YOUR path.** Step 1 is `git merge --ff-only temp`, so
  the target literally fast-forwards to `temp`'s commit. The SHA is unchanged and
  `--is-ancestor` answers the real question.
- **`--grep=$WORK` has false positives**, which is how it failed on 2026-08-27:
  `git log origin/main --grep=ex-b2k69h` matched a *documentation* commit whose
  message merely described the incident, minutes before the actual fix landed.
  Any commit that MENTIONS a bead id satisfies a grep -- a revert, a rejection
  note, an RFC. That is not proof the code is there.

⚠ The "ancestry is always false, use grep" folklore is about **squash merges**,
which rewrite SHAs. That is how GitHub lands a PR, and it is NOT how you land a
bead. Do not import the workaround for a merge strategy you do not use. If you
ever find yourself verifying someone else's squash merge, grep is the weaker
tool you fall back to, and you read the matched commit before believing it.

⚠⚠ **A bead may ONLY close when its code is on the target branch.** On
2026-08-27 this step closed `ex-b2k69h` on a PR handoff with the code still off
`main`. That released the bead's dependent `ex-gkscl2`, which reads ready the
instant its blocker closes, onto a `main` missing the guard it builds on.
Neither outcome is a conflict and both compile, which is why this gate is here.

**4. Record merge metadata and close work bead:**
```bash
gc bd update $WORK \
  --set-metadata merge_result=merged \
  --set-metadata merged_sha=$(git rev-parse HEAD) \
  --set-metadata merged_target=$TARGET
gc bd close $WORK --reason "Merged to $TARGET at $(git rev-parse --short HEAD)"
```

**5. Close a pull request the polecat should not have opened:**
```bash
if [ -n "$EXISTING_PR" ]; then
  MERGED_SHORT=$(git rev-parse --short origin/$TARGET)
  gh pr close "$EXISTING_PR" --comment "Merged directly to $TARGET as $MERGED_SHORT by the refinery. This repository's fleet path is polecat -> reviewer -> refinery -> $TARGET; a bead branch does not land through a pull request. See forged-conventions rule 12."
  PR_STATE_AFTER=$(gh pr view "$EXISTING_PR" --json state -q '.state')
  if [ "$PR_STATE_AFTER" != "CLOSED" ] && [ "$PR_STATE_AFTER" != "MERGED" ]; then
    gc mail send mayor/ -s "Could not close stray PR for $WORK" -m "PR: $EXISTING_PR
State after close attempt: $PR_STATE_AFTER
The merge itself SUCCEEDED; only the PR cleanup failed. Bead $WORK is closed and
its code is on $TARGET. Close the PR by hand."
  fi
fi
```
⚠ Do this **after** the push, never before: if the merge fails you still want the
PR. ⚠ A squash or rebase merge does **not** auto-close a PR, because the SHA on
the target differs from the branch's. GitHub leaves it open forever unless you
close it explicitly, which is why the state is re-read.

⚠ Failing to close the PR is **not** a merge failure. Mail the mayor and carry on;
do not reopen, revert, or block the bead over it.

**6. Cleanup:**
```bash
git branch -d temp
```
If delete_merged_branches = "true": `git push origin --delete $BRANCH`

**GATE**: bead closure requires BOTH a verified target push AND
`git merge-base --is-ancestor temp origin/$TARGET`. A pull request never
satisfies this gate, and neither does a grep match."""

[[steps]]
id = "patrol-summary"
title = "Record patrol cycle summary"
needs = ["merge-push"]
description = """
Summarize this patrol cycle for handoff context. This becomes the
audit trail — the next refinery session can see what happened.

Include:
- Branch merged (name, target)
- Test results (pass/fail, which checks ran)
- Bugs filed (IDs, if any pre-existing failures were tracked)
- Rejections (if the branch was rejected back to pool)
- Any escalations sent

If the cycle ended early (conflict rejection, no work found), note
why and what state was left.

This summary is not stored separately — it lives in the wisp's
closing reason. The next session can find it via `gc bd list --type=wisp
--status=closed --limit=5` if it needs predecessor context."""

[[steps]]
id = "next-iteration"
title = "Prepare next patrol iteration"
needs = ["patrol-summary"]
description = """
**Config: integration_branch_auto_land = {{integration_branch_auto_land}}**

**1. Integration branch check (only if auto_land = "true"):**

If the merge target was an integration branch, check if the parent
owned convoy is now fully closed:
```bash
gc bd list --type=convoy --status=open
```
For each owned convoy with an integration branch: if ALL children are
closed, assign the convoy bead itself to you with the metadata needed
for a merge:
```bash
gc bd update <convoy-id> --assignee=$GC_AGENT \
  --set-metadata branch=<integration-branch> \
  --set-metadata target={{target_branch}}
```
The next patrol iteration picks up the convoy like any other work bead
and merges the integration branch to {{target_branch}} normally.

**FORBIDDEN**: Landing integration branches via raw `git merge`/`git push`.
The convoy bead assignment is the ONLY path.

If auto_land = "false": skip this entirely.

**2. Pour next iteration:**
```bash
NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id')
gc bd update "$NEXT" --assignee=$GC_AGENT
```

**4. Burn this wisp:**
```bash
gc bd mol burn <this-wisp-id> --force
```

Close this step. The new wisp is ready — re-read formula steps to begin."""
