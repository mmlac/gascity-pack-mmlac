# polecat-qwen-local — local-model polecat on the OpenCode harness, pinned to
# qwen-polecat:latest (baked qwen3.5:122b-a10b variant, num_ctx 64k) served by
# ollama on the macOS host.
#
# Model selection: the provider "qwen-local" (city.toml) sets
# OPENCODE_CONFIG_CONTENT to pin ollama/qwen-polecat:latest. gascity has no model
# option-schema for opencode and its ACP session/new passes no model, so the
# model is chosen in opencode's own config and overridden per-provider by that
# env. The ollama provider + model catalog live in ~/.config/opencode/opencode.jsonc.
#
# Persona pool is constellations — disjoint from polecat-sonnet (philosophers),
# polecat-opus (Mad Max), polecat-haiku (rock bands) and polecat-devstral-local
# (rivers) so no two pools share a persona name (shared names collapse to the
# same worktree path → sibling-branch contamination).
#
# max_active_sessions = 1: ollama serializes inference and the 81GB model
# saturates the Mac's memory; concurrent sessions would queue and thrash. Keep
# the local pool to one worker at a time.
#
# Routing in:  gc sling <rig>/polecat-qwen-local <bead>
# Routing out (on review/refinery rejection): preserved via the `worker_pool`
# metadata stamp set by mol-polecat-work stamp-worker-pool.

scope = "rig"
provider = "qwen-local"
wake_mode = "fresh"
work_dir = ".gc/worktrees/{{.Rig}}/polecats/{{.Agent}}/{{.AgentBase}}"
prompt_template = "/gc/packs/mmlac/shared/polecat/prompt-local.template.md"
namepool = "/gc/packs/mmlac/shared/polecat/namepool-qwen-local.txt"
nudge = "Run gc hook; it checks assigned work first, then routed pool work."
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync"]
idle_timeout = "2h"
min_active_sessions = 0
max_active_sessions = 1
default_sling_formula = "mol-polecat-work-local"
