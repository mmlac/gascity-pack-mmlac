scope = "rig"
provider = "claude"
wake_mode = "fresh"
work_dir = ".gc/worktrees/{{.Rig}}/refinery"
nudge = "Run 'gc prime' to check merge queue and begin processing."
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync"]
idle_timeout = "2h"
# RESTORED 2026-09-03 from the packaged gastown pack: without this the
# refinery never sleeps on idle, so a wedged session persists indefinitely
# instead of cycling. Absent from this fork; 15 manual unwedges in one night.
sleep_after_idle = "300s"
max_active_sessions = 1

[option_defaults]
model = "sonnet"
effort = "high"
