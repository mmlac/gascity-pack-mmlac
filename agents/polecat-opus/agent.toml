# polecat-opus — Claude Opus 5 variant of the polecat pool.
# (The "opus" tier alias is repointed to claude-opus-5 in /gc/city.toml.)
#
# Same lifecycle as the bare `polecat` agent (mol-polecat-work), but pinned
# to opus and capped low because opus is expensive. Use for high-complexity
# work: deep refactors, architecture-level changes, gnarly bugs.
#
# Persona pool is Mad Max: Fury Road names (opus-only) — disjoint from
# polecat-sonnet (philosophers) and polecat-haiku (rock bands). In practice
# {{.Agent}} in the work_dir resolved to the persona-qualified name, NOT
# the tier, so two tiers picking the same persona collapsed to the same
# worktree path and caused sibling-branch contamination. Per-tier disjoint
# pools eliminate that class of bug deterministically.
#
# Routing in:  gc sling <rig>/polecat-opus <bead>
# Routing out (on review/refinery rejection): preserved via the `worker_pool`
# metadata stamp set by mol-polecat-work stamp-worker-pool. Without that
# stamp (legacy beads), rejection falls back to bare `<rig>/polecat`.

scope = "rig"
provider = "claude"
wake_mode = "fresh"
work_dir = ".gc/worktrees/{{.Rig}}/polecats/{{.Agent}}/{{.AgentBase}}"
prompt_template = "/gc/packs/mmlac/shared/polecat/prompt.template.md"
namepool = "/gc/packs/mmlac/shared/polecat/namepool.txt"
nudge = "Run gc hook --claim --json to TAKE your next work item and begin it immediately. It checks assigned work first, then routed pool work. Plain 'gc hook' only READS and does not claim -- reading it and stopping leaves the work unowned and the wave stalled."
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync"]
idle_timeout = "2h"
min_active_sessions = 0
max_active_sessions = 2
default_sling_formula = "mol-polecat-work"

[option_defaults]
model = "opus"
# xhigh is Anthropic's recommended starting effort for coding/agentic work on
# Opus 5 (it is also Claude Code's own default there); high was the Opus 4.x setting.
effort = "xhigh"
